[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openrouter-dataeng"
version = "0.1.0"
description = "Data Engineering project for OpenRouter Aula"
readme = "README.md"
authors = [{name = "Data Engineering Team", email = "dataeng@example.com"}]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",

    # Data Processing
    "pandas>=2.0",
    "polars>=1.0",
    "pyarrow>=14.0",

    # Database
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.28",

    # Cloud Storage
    "boto3>=1.34",
    "s3fs>=2023.12",

    # Orchestration
    "apache-airflow>=2.8",
    "apache-airflow-providers-postgres>=5.8",
    "apache-airflow-providers-amazon>=8.10",

    # Data Quality
    "great-expectations>=0.18",

    # Serialization
    "pyyaml>=6.0",
    "orjson>=3.9",

    # Logging
    "structlog>=24.0",
    "python-json-logger>=2.0",

    # Utils
    "tenacity>=8.0",
    "rich>=13.0",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.0",
    "pre-commit>=3.0",
    "ipykernel>=6.0",
    "jupyter>=1.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "hypothesis>=6.0",
]

[project.urls]
Homepage = "https://github.com/yourorg/openrouter-dataeng"
Repository = "https://github.com/yourorg/openrouter-dataeng"
Issues = "https://github.com/yourorg/openrouter-dataeng/issues"

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default args
]
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pre-commit]
repos = [
    {repo = "https://github.com/astral-sh/ruff-pre-commit", rev = "v0.4.0", hooks = [
        {id = "ruff", args = ["--fix", "--exit-non-zero-on-fix"]},
        {id = "ruff-format"},
    ]},
    {repo = "https://github.com/pre-commit/mirrors-mypy", rev = "v1.0.0", hooks = [
        {id = "mypy", args = ["--strict"]},
    ]},
]